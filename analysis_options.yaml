# analysis_options.yaml
# Base Flutter lints (stable, sensible defaults)
include: package:flutter_lints/flutter.yaml

analyzer:
  # Don't waste analyzer time on generated/build outputs
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "build/**"
    - ".dart_tool/**"
    - "coverage/**"
    - "**/*.mocks.dart"

  # (Optional) treat some lints as warnings, not errors, during early dev.
  # If CI still fails on warnings in your setup, you can tighten later.
  errors:
    # Keep these as 'warning' so they don't block you on day 1
    avoid_print: warning
    always_use_package_imports: warning

linter:
  rules:
    # ✅ Style & safety
    always_use_package_imports: true
    prefer_single_quotes: true
    prefer_final_fields: true
    prefer_const_constructors: true
    prefer_const_literals_to_create_immutables: true
    require_trailing_commas: true
    use_super_parameters: true

    # ⚠️ Print: keep it discouraged, but not fatal early on
    avoid_print: true

    # 💡 Concurrency hygiene (only if analyzer recognizes it in your SDK)
    # If CI says "unrecognized lint rule 'unawaited_futures'", remove this line.
    unawaited_futures: true
