# File: .github/workflows/ci.yml
name: Flutter CI

on:
  push:
    branches: [ dev, main ]
  pull_request:
    branches: [ dev, main ]

jobs:
  test_analyze:
    name: Lint, Format Check, Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 🔧 Pin Flutter toolchain to match your local version
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.2'   # ← change to your local Flutter version
          channel: 'stable'
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Analyze (lint)
        run: flutter analyze

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Run tests
        run: flutter test --coverage

      # (Optional) Save coverage as an artifact for later download
      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/

  # ---- OPTIONAL: quick Android build to catch compile errors ----
  # Enable this job if you want CI to ensure the app compiles.
  # Remove the "if: false" line below to turn it on.
  android_debug_build:
    if: false   # ← set to true or remove this line to enable
    name: Android Debug Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.2'   # ← same pinned version as above
          channel: 'stable'
          cache: true

      # JDK needed for Android build
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Flutter pub get
        run: flutter pub get

      # Build a debug APK (no signing)
      - name: Build debug APK
        run: flutter build apk --debug
